server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Fuentes e imágenes casi nunca cambian: caché larga
  location ~* \.(woff2|jpg|jpeg|png|webp)$ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # La página y sus scripts sí cambian al desplegar: que el navegador revalide
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}
